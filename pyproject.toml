description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gavin.Huang", email = "gavin.huang13@pouchen.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "blinker>=1.9.0",
    "bs4>=0.0.2",
    "certifi>=2026.7.22",
    "feedparser>=6.0.14",
